services:
  db:
    image: postgres:15-alpine
    container_name: tenantguard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenantguard}
      # Set in .env (generate with: openssl rand -base64 24)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tenantguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tenantguard} -d $${POSTGRES_DB:-tenantguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenantguard_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tenantguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tenantguard_db}
      # Required minimum 32 chars. Set in .env (generate with: openssl rand -hex 32)
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - UPLOAD_DIR=/app/uploads
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ENVIRONMENT=development
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
      - ./app:/app/app
      - ./tests:/app/tests

  # ----------------------------------------------------------------------------
  # Observability Stack (Loki / Promtail / Grafana)
  # Guarded behind the 'observability' profile to keep standard CI/DAST fast & clean.
  # Start with: docker compose --profile observability up -d
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: tenantguard_loki
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    container_name: tenantguard_promtail
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tenantguard_grafana
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres_data:
